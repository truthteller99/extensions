name: Build and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew makeAll

      - name: Push builds
        run: |
          cp -r repo.json builds/
          cp -r plugins.json builds/ || true
          id=$(echo ${{ github.repository }} | cut -d'/' -f1)
          repo=$(echo ${{ github.repository }} | cut -d'/' -f2)
          cd builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Update plugins" || exit 0
          git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@://github.com{id}/${repo}.git" HEAD:builds
